# SERVER-SIDE ONLY. Never copied into out/public or any web file.
# Every number here is an UNTUNED default chosen up front (not fitted to any data).
min_history: 60          # bars before a stock gets a score (else status new_listing)
stale_zero_volume: 3     # >= this many zero-volume days in the last 5 -> status illiquid
band_strong: 70
band_mixed: 40
weights:
  trend: 0.20
  momentum: 0.20
  relative_strength: 0.20
  volume_delivery: 0.15
  volatility: 0.10
  quality: 0.075         # only when a fundamentals file exists
  valuation: 0.075       # only when a fundamentals file exists
fear_greed:
  window: 252            # trailing days used to place each reading on 0-100
  min_window: 120
  bands: [25, 45, 55, 75]
rotation:
  min_stocks: 3
  rs_ma: 60
  change_days: 10
validate:
  horizon: 10
  cost_per_side_pct: 0.10   # base assumption; reports use DOUBLE (0.20 per side)
  train_end: "2022-12-31"
  test_start: "2023-01-01"
screeners:               # untuned. Percent = share of scored stocks (top/bottom); enter/exit = hysteresis band
  strong_trend:     {enter: 0.15, exit: 0.25, overall: 0.40}   # trend top 15%, stays until out of top 25%; overall top 40%
  pullback_uptrend: {enter: 0.15, exit: 0.25, trend: 0.35}     # 5-day return in the bottom 15%; trend top 35%
  volume_breakout:  {enter: 0.15}                              # one-day event: volume ratio top 15%
  rs_leaders:       {enter: 0.15, exit: 0.25, trend: 0.60}
  near_52w_high:    {enter: 0.03, exit: 0.05}                  # distance below the 52-week high (a fraction, not a rank)
  delivery_rise:    {enter: 0.15, exit: 0.25}
  steady_uptrend:   {enter: 0.25, exit: 0.35, trend: 0.40}
  weakest:          {enter: 0.15, exit: 0.25}
costs:                   # equity DELIVERY trades (10-day holds), percent of traded value unless noted. Check current NSE/SEBI rates.
  multiplier: 2.0        # reports DOUBLE every cost (rule: costs doubled)
  stt_pct: 0.10          # securities transaction tax, buy and sell
  brokerage_pct: 0.03    # conservative: many brokers charge 0 on delivery
  exchange_pct: 0.00297  # NSE transaction charge
  sebi_pct: 0.0001       # Rs 10 per crore
  gst_pct: 18            # on brokerage + exchange + SEBI fee
  stamp_buy_pct: 0.015   # stamp duty, buy side only
  dp_sell_rs: 15.93      # depository charge per sell (Rs 13.5 + 18% GST), flat per scrip
  slippage_atr_frac: 0.05  # each side: 5% of the stock's average true range (as a fraction of price)
portfolio:
  capital: 1000000       # Rs, paper only
  n_positions: 10
  hold_days: 10          # rebalance every N sessions; positions still selected are kept (no trade, no cost)
  capacity_adv_pct: 5    # a position may be at most 5% of the stock's 20-day average traded value
stats:
  bootstrap_reps: 2000
  block: 3               # block length (in rebalance periods) for the bootstrap and Monte Carlo
  mc_paths: 5000
  random_null_runs: 100  # random-selection portfolios used to show what "by chance" looks like
  alpha: 0.05
  seed: 20261030
