<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="data-base" content="../out/">
<title>NiftyRadar Scores</title>
<style>
:root{--bg:#0a0e14;--card:#111823;--line:#1e2a3a;--txt:#d6e0ee;--dim:#8a9bb2;--g:#2ecc8f;--r:#ff5d6c;--a:#f5b84b;--b:#4aa3ff;--soft:#0d1420;--grid:#26364b;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f6fa;--card:#fff;--line:#d9e0ea;--txt:#1b2430;--dim:#566679;--g:#0b8a5c;--r:#cc2d44;--a:#a86a0a;--b:#1a63c4;--soft:#eef2f8;--grid:#c9d3e0;color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f6fa;--card:#fff;--line:#d9e0ea;--txt:#1b2430;--dim:#566679;--g:#0b8a5c;--r:#cc2d44;--a:#a86a0a;--b:#1a63c4;--soft:#eef2f8;--grid:#c9d3e0;color-scheme:light}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;letter-spacing:.08em;color:var(--g)}
.bar-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav{display:flex;flex-wrap:wrap;gap:6px}nav a{color:var(--dim);text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
nav a.on{color:var(--txt);border-color:var(--g)}
#theme{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
main{padding:12px 16px 24px;max-width:1120px;margin:0 auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.grid+.grid,div+.grid{margin-top:12px}.card.wide{grid-column:1/-1}.tw{overflow-x:auto;max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.i{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--dim);background:none;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;flex:none}
.tip{margin:0 0 10px;padding:8px;border-left:2px solid var(--b);background:var(--soft);color:var(--dim);font-size:12px}.tip[hidden]{display:none}
svg{display:block;width:100%;height:auto}.gauge{max-width:300px;margin:0 auto}
.big{text-align:center;font-size:30px;font-weight:700;line-height:1.1}.lab{text-align:center;color:var(--dim);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 0;border-top:1px solid var(--line);min-width:0}
.row.first{border-top:0}.sym{font-weight:700;min-width:104px;font-size:13px}a.sym{color:var(--txt);text-decoration:none;border-bottom:1px dotted var(--dim)}
.bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:48px;border:1px solid var(--line)}.bar>i{display:block;height:100%}
.n{width:34px;text-align:right}.says{color:var(--dim);font-size:12px;flex-basis:100%}
.pill{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid currentColor;white-space:nowrap}
.Strong,.Leading,.Greed,.good,.Extreme-greed{color:var(--g)}.Weak,.Lagging,.Fear,.bad,.Extreme-fear{color:var(--r)}.Mixed,.Weakening,.Neutral,.warn{color:var(--a)}.Improving{color:var(--b)}
.disc{color:var(--dim);font-size:11px;margin:14px 0 4px}.empty{color:var(--dim);margin:4px 0 0}
.banner{border:1px dashed var(--a);color:var(--a);border-radius:8px;padding:10px;margin-bottom:12px;font-size:13px}
input[type=search]{width:100%;padding:10px;background:var(--soft);border:1px solid var(--line);border-radius:8px;color:var(--txt);font:inherit;margin-bottom:10px}
.note{color:var(--dim);font-size:12px;margin:6px 0 0}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:6px 4px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
table.t th{border-top:0;color:var(--dim);font-weight:600;font-size:12px}table.t th button{all:unset;cursor:pointer;color:inherit;padding:2px 0}
table.t th button:focus-visible{outline:2px solid var(--b)}table.t td.num,table.t th.num{text-align:right}
table.t td.why{color:var(--dim);font-size:12px}
.hm td{text-align:center;padding:6px 2px;font-size:12px;border:1px solid var(--line)}.hm th{font-size:11px;color:var(--dim);font-weight:600;padding:4px 2px}
@media(max-width:480px){main{padding:10px 10px 20px}.sym{min-width:92px}table.t td.why{display:none}table.t th.why{display:none}}
</style></head><body>
<header><h1>NIFTYRADAR · SCORES</h1><div class="bar-top">
<nav id="nav"><a href="#overview">Overview</a><a href="#rotation">Rotation</a><a href="#feargreed">Fear/Greed</a><a href="#screeners">Screeners</a><a href="#stocks">Stocks</a><a href="#validation">Does it work?</a><a href="#robustness">Robustness</a><a href="#health">Data health</a></nav>
<button id="theme" type="button" aria-label="Switch dark and light theme">Theme</button></div></header>
<main id="app" aria-live="polite"><p class="empty">Loading…</p></main>
<script>
const BASE=new URL((document.querySelector('meta[name=data-base]')||{}).content||'../out/',location.href).href;
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const NS='http://www.w3.org/2000/svg';
const sv=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a){if(k==='fill'||k==='stroke')e.style[k]=a[k];else e.setAttribute(k,a[k])}if(p)p.append(e);return e};
const col=v=>v>=70?'var(--g)':v>=40?'var(--a)':'var(--r)';
const cls=s=>String(s).replace(/ /g,'-');
const cache={};
async function j(n,optional){if(cache[n]!==undefined)return cache[n];let r;try{r=await fetch(BASE+n+'.json')}catch(e){r=null}
  if(!r||!r.ok){if(optional){cache[n]=null;return null}throw new Error('Data not built yet. Run: python -m scores.run')}cache[n]=await r.json();return cache[n]}
function card(title,tip){const c=$('section','card'),h=$('h2');h.append($('span',null,title));
  if(tip){const b=$('button','i','i');b.type='button';b.setAttribute('aria-label','About '+title);b.setAttribute('aria-expanded','false');
    const t=$('p','tip',tip);t.hidden=true;b.onclick=()=>{t.hidden=!t.hidden;b.setAttribute('aria-expanded',String(!t.hidden))};h.append(b);c.append(h,t)}else c.append(h);return c}
const grid=(...c)=>{const g=$('div','grid');g.append(...c);return g};
const bar=v=>{const b=$('div','bar'),i=$('i');i.style.width=v+'%';i.style.background=col(v);b.append(i);return b};
const disc=t=>$('p','disc',t);
const empty=(t)=>{const c=card('Nothing to show yet');c.append($('p','empty',t));return c};
function gauge(v){const s=sv('svg',{viewBox:'0 0 200 112',class:'gauge',role:'img','aria-label':'Gauge '+v+' of 100'});
  const pt=a=>[100+80*Math.cos(Math.PI*(1-a/100)),100-80*Math.sin(Math.PI*(1-a/100))];
  [[0,25,'#ff5d6c'],[25,45,'#ff9a5d'],[45,55,'#f5b84b'],[55,75,'#8ccf6b'],[75,100,'#2ecc8f']].forEach(([a,b,c])=>{const [x0,y0]=pt(a),[x1,y1]=pt(b);sv('path',{d:`M${x0} ${y0}A80 80 0 0 1 ${x1} ${y1}`,stroke:c,'stroke-width':14,fill:'none'},s)});
  const a=Math.PI*(1-v/100);sv('line',{x1:100,y1:100,x2:100+62*Math.cos(a),y2:100-62*Math.sin(a),stroke:'var(--txt)','stroke-width':3,'stroke-linecap':'round'},s);return s}
function lineChart(h,label){if(!h||h.length<2)return $('p','empty','Not enough history yet.');
  const W=360,H=130,s=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':label});
  [[0,25,'#ff5d6c'],[25,45,'#ff9a5d'],[45,55,'#f5b84b'],[55,75,'#8ccf6b'],[75,100,'#2ecc8f']].forEach(([a,b,c])=>sv('rect',{x:0,y:H-b*H/100,width:W,height:(b-a)*H/100,fill:c,opacity:.14},s));
  const pts=h.map((p,i)=>[i*(W-2)/(h.length-1)+1,H-p.v*H/100]);
  sv('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'var(--txt)','stroke-width':1.6,'stroke-linejoin':'round'},s);
  const l=pts[pts.length-1];sv('circle',{cx:l[0],cy:l[1],r:3.5,fill:'var(--txt)'},s);return s}
function spark(vals,label,W=300,H=44){const v=vals.map((x,i)=>[i,x]).filter(p=>p[1]!=null);if(v.length<2)return $('p','empty','No history yet.');
  const s=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':label,preserveAspectRatio:'none',style:'height:'+H+'px'});
  [40,70].forEach(y=>sv('line',{x1:0,y1:H-y*H/100,x2:W,y2:H-y*H/100,stroke:'var(--grid)','stroke-dasharray':'3 3'},s));
  const n=vals.length-1,pts=v.map(([i,x])=>[i*(W-2)/n+1,H-2-x*(H-4)/100]);
  sv('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:col(v[v.length-1][1]),'stroke-width':1.8,'stroke-linejoin':'round'},s);
  const l=pts[pts.length-1];sv('circle',{cx:l[0],cy:l[1],r:3,fill:col(v[v.length-1][1])},s);return s}
function rrg(rows){const W=360,H=300,s=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'Sector rotation chart: strength against its change'});
  const mx=Math.max(2,...rows.flatMap(r=>[Math.abs(r.strength),...r.trail.map(t=>Math.abs(t.x))])),my=Math.max(1,...rows.flatMap(r=>[Math.abs(r.change),...r.trail.map(t=>Math.abs(t.y))]));
  const X=v=>W/2+v/mx*(W/2-34),Y=v=>H/2-v/my*(H/2-18);
  [['Improving',4,14,'var(--b)'],['Leading',W/2+4,14,'var(--g)'],['Lagging',4,H-6,'var(--r)'],['Weakening',W/2+4,H-6,'var(--a)']].forEach(([t,x,y,c])=>{const e=sv('text',{x,y,'font-size':11,opacity:.9,fill:c},s);e.textContent=t});
  sv('line',{x1:W/2,y1:0,x2:W/2,y2:H,stroke:'var(--grid)'},s);sv('line',{x1:0,y1:H/2,x2:W,y2:H/2,stroke:'var(--grid)'},s);
  const stc={Leading:'var(--g)',Weakening:'var(--a)',Improving:'var(--b)',Lagging:'var(--r)'};
  rows.forEach(r=>{const c=stc[r.stage];if(r.trail.length>1)sv('polyline',{points:r.trail.map(t=>X(t.x)+','+Y(t.y)).join(' '),fill:'none',stroke:c,opacity:.5,'stroke-width':1.5},s);
    const x=X(r.strength),y=Y(r.change);sv('circle',{cx:x,cy:y,r:5,fill:c},s);
    const e=sv('text',{x:x>W-70?x-8:x+8,y:y+4,fill:'var(--txt)','font-size':11,'text-anchor':x>W-70?'end':'start'},s);e.textContent=r.sector});return s}
function radar(sc){const keys=Object.keys(sc).filter(k=>k!=='overall'),n=keys.length,R=82,C=110;
  const s=sv('svg',{viewBox:'-40 -6 300 232',role:'img','aria-label':'Score profile: '+keys.map(k=>NAME[k]+' '+sc[k].score).join(', ')});
  const P=(i,r)=>[C+r*Math.sin(2*Math.PI*i/n),C-r*Math.cos(2*Math.PI*i/n)];
  [.25,.5,.75,1].forEach(f=>sv('polygon',{points:keys.map((_,i)=>P(i,R*f).join(',')).join(' '),fill:'none',stroke:'var(--grid)'},s));
  keys.forEach((k,i)=>{const [x,y]=P(i,R+14);const t=sv('text',{x,y:y+4,fill:'var(--dim)','font-size':10,'text-anchor':x<C-5?'end':x>C+5?'start':'middle'},s);t.textContent=NAME[k]});
  sv('polygon',{points:keys.map((k,i)=>P(i,R*sc[k].score/100).join(',')).join(' '),fill:'var(--g)','fill-opacity':.25,stroke:'var(--g)','stroke-width':2},s);return s}
const NAME={trend:'Trend',momentum:'Momentum',relative_strength:'Rel. strength',volume_delivery:'Vol & delivery',volatility:'Stability',quality:'Quality',valuation:'Valuation',overall:'Overall'};
function table(cols,rows,opts={}){const t=$('table','t'),th=t.createTHead().insertRow();let sk=opts.sort??-1,dir=opts.desc?-1:1;
  const body=t.createTBody();
  const draw=()=>{body.replaceChildren();const rs=rows.slice();if(sk>=0){const c=cols[sk];rs.sort((a,b)=>{const x=c.val(a),y=c.val(b);return (x==null)-(y==null)||(typeof x==='number'?x-y:String(x).localeCompare(String(y)))*dir})}
    rs.forEach(r=>{const tr=body.insertRow();cols.forEach(c=>{const td=tr.insertCell();td.className=(c.num?'num ':'')+(c.cls||'');const v=c.show?c.show(r):c.val(r);if(v instanceof Node)td.append(v);else td.textContent=v==null?'–':v})})};
  cols.forEach((c,i)=>{const h=document.createElement('th');h.className=(c.num?'num ':'')+(c.cls||'');h.scope='col';const b=$('button',null,c.name);b.type='button';
    b.onclick=()=>{dir=sk===i?-dir:(c.num?-1:1);sk=i;th.querySelectorAll('th').forEach((x,k)=>x.setAttribute('aria-sort',k===i?(dir>0?'ascending':'descending'):'none'));draw()};h.append(b);th.append(h)});
  if(sk>=0)th.children[sk].setAttribute('aria-sort',dir>0?'ascending':'descending');draw();const w=$('div','tw');w.append(t);return w}
const symLink=s=>{const a=$('a','sym',s);a.href='#stock/'+encodeURIComponent(s);return a};
function stockRow(c,first){const o=c.scores.overall,r=$('div','row'+(first?' first':''));
  r.append(symLink(c.symbol),bar(o.score),$('span','n',o.score),$('span','pill '+o.band,o.band),$('div','says',c.sector+' · '+o.says));return r}
function fgCard(fg,withHistory=true){const c=card('Fear / Greed','A 0-100 reading of market mood built from breadth, advances and declines, volatility, option positioning and Nifty trend. Each reading is placed against its own past year. It describes mood today and does not predict anything.');
  if(fg.value==null){c.append($('p','empty','Not enough history for the meter yet.'));return c}
  c.append(gauge(fg.value),$('div','big',fg.value),$('div','lab '+cls(fg.label),fg.label));if(withHistory)c.append(lineChart(fg.history,'Fear and greed history, last '+fg.history.length+' days'));
  fg.parts.forEach((p,i)=>{const r=$('div','row'+(i?'':' first'));r.append($('span',null,p.name));r.firstChild.style.flex='1.6';r.append(p.value==null?$('span','n','–'):bar(p.value),$('span','n',p.value==null?'':p.value));c.append(r)});
  if(fg.not_available.length)c.append($('p','note','Not loaded: '+fg.not_available.join(', ')+'.'));return c}
function rotCard(rot){const c=card('Sector rotation','Each dot is a sector. Right means ahead of the Nifty 50 over recent weeks, up means that lead is growing. The tail shows the last 8 sessions.');
  if(!rot.sectors.length){c.append($('p','empty','No sector has enough scored stocks yet.'));return c}
  c.append(rrg(rot.sectors));return c}
function rotTable(rot){const c=card('Sectors','Strength = how far the sector is ahead of the Nifty 50 against its own recent average. Change = how that moved over 10 sessions. Breadth = share of its stocks above their 50-day average.');
  c.append(table([{name:'Sector',val:r=>r.sector},{name:'Stage',val:r=>r.stage,show:r=>$('span','pill '+r.stage,r.stage)},{name:'Strength',num:1,val:r=>r.strength},{name:'Change',num:1,val:r=>r.change},{name:'Stocks',num:1,val:r=>r.stocks},{name:'Breadth %',num:1,val:r=>r.breadth,cls:'why'}],rot.sectors,{sort:2,desc:true}));return c}
const V={
async overview(m){const [fg,rot,ov]=await Promise.all([j('feargreed'),j('rotation'),j('overview')]);
  const c3=card('Highest overall scores','Overall score 0-100 summarises trend, momentum, relative strength, volume and delivery, stability and (when loaded) quality and valuation. It describes what the data shows now. It is not a recommendation.');
  ov.top.forEach((s,i)=>c3.append(stockRow(s,!i)));
  const c4=card('Lowest overall scores','The weakest readings across the same measures.');ov.bottom.forEach((s,i)=>c4.append(stockRow(s,!i)));
  const hb=$('p','note');hb.append('Data health: ',$('span',ov.health_grade,ov.health_grade),' · '+ov.scored+' stocks scored · ');const l=$('a',null,'details');l.href='#health';l.style.color='var(--b)';hb.append(l);
  m.append(grid(fgCard(fg),rotCard(rot),c3,c4),hb,disc(ov.disclaimer+' Data date '+ov.date+'.'))},
async rotation(m){const rot=await j('rotation');m.append(grid(rotCard(rot),rotTable(rot)),disc(rot.disclaimer+' Data date '+rot.date+'.'))},
async feargreed(m){const fg=await j('feargreed');m.append(grid(fgCard(fg)),disc(fg.disclaimer+' Data date '+fg.date+'.'))},
async screeners(m){const d=await j('screeners');const g=$('div','grid');
  d.screeners.forEach(sc=>{const c=card(sc.title+' ('+sc.count+')','Rule: '+sc.rule+'. A statistical filter shown as data. Not a recommendation.');
    if(!sc.rows.length)c.append($('p','empty','No stocks match today.'));
    else c.append(table([{name:'Symbol',val:r=>r.symbol,show:r=>symLink(r.symbol)},{name:'Score',num:1,val:r=>r.overall},{name:'Why listed',cls:'why',val:r=>r.why}],sc.rows));
    g.append(c)});
  m.append(g,disc(d.disclaimer+' Data date '+d.date+'.'))},
async stocks(m){const d=await j('scores');const c=card('All stocks','Overall score and band for every stock. Click a column to sort; open a stock for its full breakdown.');
  const q=$('input');q.type='search';q.placeholder='Search symbol';q.setAttribute('aria-label','Search symbol');const box=$('div');
  const all=d.stocks.map(s=>({s:s.symbol,sector:s.sector,o:s.scores&&s.scores.overall?s.scores.overall.score:null,b:s.scores&&s.scores.overall?s.scores.overall.band:(s.note||s.status)}));
  const draw=()=>{const t=q.value.trim().toUpperCase();const rows=all.filter(r=>r.s.includes(t));box.replaceChildren(rows.length?table([{name:'Symbol',val:r=>r.s,show:r=>symLink(r.s)},{name:'Sector',val:r=>r.sector,cls:'why'},{name:'Overall',num:1,val:r=>r.o},{name:'Band',val:r=>r.b,show:r=>$('span','pill '+(r.o==null?'':r.b),r.o==null?'Not scored':r.b)}],rows,{sort:2,desc:true}):$('p','empty','No match.'))};
  q.oninput=draw;draw();c.append(q,box);m.append(c,disc(d.disclaimer+' Data date '+d.date+'.'))},
async stock(m,sym){const d=await j('scores');const hist=await j('history',true);const s=d.stocks.find(x=>x.symbol===sym);if(!s){m.append($('p','empty','Unknown symbol.'));return}
  const back=$('a',null,'← all stocks');back.href='#stocks';back.style.color='var(--b)';m.append(back);
  if(s.status!=='ok'){const n=card(s.symbol+' · '+s.sector,null);n.append($('p','empty',s.note));m.append(n);return}
  const o=s.scores.overall,H=hist&&hist.stocks[sym];const c1=card(s.symbol+' · '+s.sector,'Overall is a blend of the scores that have data. Scores with data = how many had data.');
  c1.append(radar(s.scores),$('div','big',o.score),$('div','lab '+o.band,o.band+' · '+o.says),$('p','note','Scores with data: '+o.coverage));
  const c0=card('Score history','The last '+(hist?hist.dates.length:0)+' sessions. Dashed lines mark 40 and 70. The line shows what the score was each day; it does not forecast anything.');
  if(H&&H.overall){c0.append($('p','note','Overall'),spark(H.overall,'Overall score history for '+sym));
    Object.keys(s.scores).filter(k=>k!=='overall'&&H[k]).forEach(k=>{c0.append($('p','note',NAME[k]),spark(H[k],NAME[k]+' history for '+sym,300,32))})}else c0.append($('p','empty','No history file for this stock.'));
  const g=$('div','grid');g.append(c1,c0);
  Object.keys(s.scores).filter(k=>k!=='overall').forEach(k=>{const x=s.scores[k],c=card(NAME[k]+' · '+x.score,'What this score looks at. The listed readings are the plain facts behind it.');
    c.append($('p','lab '+x.band,x.band+' · '+x.says));x.components.forEach((p,i)=>{const r=$('div','row'+(i?'':' first'));r.append($('span',null,p.reading),bar(p.score),$('span','n',p.score));r.firstChild.style.flexBasis='100%';c.append(r)});g.append(c)});
  m.append(g,disc(d.disclaimer+' Data date '+d.date+'.'))},
async validation(m){const rep=await j('report',true),val=await j('validation',true);
  if(!rep&&!val){m.append(empty('The validation has not been run. Run: python -m scores.run --validate --report'));return}
  if(rep){if(rep.source==='fixtures')m.append($('div','banner','SAMPLE DATA: these numbers come from synthetic prices with planted trends. They are not evidence about the real market.'));
    const c=card('Plain verdict','Each rule is tested as a paper portfolio: 10 equal slots, one-day delay, costs doubled, point-in-time F&O universe. Test years (2023 onward) were never used to choose anything. The correction step counts how many rules were tried.');
    const ok=rep.verdict.startsWith('No edge');c.append($('div','big '+(rep.source==='fixtures'?'warn':ok?'warn':'good'),rep.source==='fixtures'?'SAMPLE DATA':ok?'NO EDGE FOUND':'LEADS ONLY'),$('p','lab',rep.verdict));

  if(val){const y=card('Score rank link by year','Each year judged out of sample: bars to the right of the middle mean higher scores lined up with higher next-10-day returns that year.');
